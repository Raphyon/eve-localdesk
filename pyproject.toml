[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eve-localdesk"
dynamic = ["version"]
description = "A local, serverless SeAT-style character manager for EVE Online"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.5", "requests>=2.28", "qtawesome>=1.3"]

[project.optional-dependencies]
dev = ["pytest", "pyinstaller", "pillow"]

[project.gui-scripts]
eve-localdesk = "localdesk.ui.app:main"

[tool.setuptools.dynamic]
version = { attr = "localdesk.__version__" }

[tool.setuptools.packages.find]
include = ["localdesk*"]

[tool.setuptools.package-data]
localdesk = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
