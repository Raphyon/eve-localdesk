# Builds EVE LocalDesk for Windows (installer + portable zip), macOS and Linux on every push to main.
# When localdesk/__init__.py has a version that has no GitHub release yet, the release job creates the
# tag (v<version>) and the release with all downloads. So releasing = bump __version__ and push.
# Pushing a v* tag yourself or running it from the Actions tab works too.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Linux system libraries for Qt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2 libdbus-1-3

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller pillow pytest

      - name: Version
        id: version
        shell: bash
        run: |
          version=$(python -c "import localdesk; print(localdesk.__version__)")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match localdesk.__version__ ($version)"; exit 1
          fi

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests

      - name: Build app
        run: pyinstaller --noconfirm packaging/eve-localdesk.spec --distpath dist --workpath build

      - name: Self-test the built app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          LOCALDESK_HOME: ${{ runner.temp }}\selftest
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
        run: |
          $p = Start-Process -FilePath "dist\EVE LocalDesk\EVE LocalDesk.exe" -ArgumentList "--selftest" -Wait -PassThru
          $log = Join-Path $env:LOCALDESK_HOME "selftest.log"
          if (Test-Path $log) { Get-Content $log } else { Write-Host "no selftest.log written" }
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }

      - name: Self-test the built app (macOS)
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: offscreen
          LOCALDESK_HOME: ${{ runner.temp }}/selftest
        run: '"dist/EVE LocalDesk.app/Contents/MacOS/EVE LocalDesk" --selftest'

      - name: Self-test the built app (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
          LOCALDESK_HOME: ${{ runner.temp }}/selftest
        run: dist/eve-localdesk/eve-localdesk --selftest

      - name: Package (Windows installer + portable zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.version.outputs.version }}" packaging\installer.iss
          Compress-Archive -Path "dist\EVE LocalDesk" -DestinationPath "dist\EVE-LocalDesk-${{ steps.version.outputs.version }}-windows-portable.zip"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/EVE LocalDesk.app" "dist/EVE-LocalDesk-${{ steps.version.outputs.version }}-macos.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -C dist -czf "dist/eve-localdesk-${{ steps.version.outputs.version }}-linux-x86_64.tar.gz" eve-localdesk

      - uses: actions/upload-artifact@v4
        with:
          name: eve-localdesk-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Is this version released yet?
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' localdesk/__init__.py)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "v$version is already released; nothing to publish."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.version.outputs.new == 'true'
        with:
          path: downloads
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        if: steps.version.outputs.new == 'true'
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: EVE LocalDesk ${{ steps.version.outputs.version }}
          files: downloads/*
          generate_release_notes: true
